name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

# 同じブランチへ立て続けに push したとき、古い実行は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ユニットテストと debug ビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # jvmToolchain(17) と sourceCompatibility 17 に合わせる。
      - name: JDK 17 を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK は ubuntu-latest に同梱されているものを使う（ANDROID_HOME 設定済み）。
      # compileSdk 36 が無ければ AGP が自動で取得する。
      # android-actions/setup-android は使わない。廃止済みの "tools" パッケージを
      # 入れようとして sdkmanager が exit 1 で落ちるため。
      - name: Gradle を用意
        uses: gradle/actions/setup-gradle@v4

      # ユニットテストとスクリーンショット検証を1回の呼び出しでまとめる。
      # verifyRoborazziDebug はテストタスクに依存するため、別々に実行すると
      # テストが2回走って無駄になる。
      - name: ユニットテストとスクリーンショット検証
        run: >-
          ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug
          -Proborazzi.test.verify=true --console=plain

      - name: debug ビルド
        run: ./gradlew :app:assembleDebug --console=plain

      # 落ちたときに原因を追えるよう、成否によらずレポートを残す。
      - name: テストレポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # スクリーンショットが一致しなかったときの比較画像。
      # 期待値・実際・差分が並んだ画像が出るので、どこが変わったか目で分かる。
      - name: スクリーンショットの差分を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore

# release ビルドはここでは行わない。署名鍵とパスワードが必要で、
# それらをリポジトリのシークレットに置く判断はまだしていないため。
#
# 参照画像 app/src/test/screenshots/*.png は CI と同じ内容であることを確認済み。
# Windows で記録したものと ubuntu-latest で記録したものがバイト単位で一致し、
# CI 上で2回記録しても同じだった（PR #10）。
# 画像を更新するときは次で撮り直してコミットする:
#   ./gradlew :app:recordRoborazziDebug -Proborazzi.test.record=true --rerun-tasks
